<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 13px; line-height: 1.55; }
      .bold { font-weight: 700; }
      .muted { fill: #8b949e; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .cyan { fill: #58a6ff; }
      .green { fill: #3fb950; font-weight: 600; }
      .yellow { fill: #d29922; }
      .red { fill: #f85149; }
      .white { fill: #c9d1d9; }
      .prompt { fill: #7ee787; font-weight: 700; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="20" y="20" width="840" height="500" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header -->
  <rect x="20" y="20" width="840" height="38" rx="10" fill="#161b22"/>
  <rect x="20" y="48" width="840" height="10" fill="#161b22"/>
  <line x1="20" y1="58" x2="860" y2="58" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="42" cy="39" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="62" cy="39" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="82" cy="39" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Window Title -->
  <text x="440" y="44" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="500">bash — python src/main.py --file data/orders_sample.csv</text>

  <!-- Terminal Content -->
  <g class="mono" transform="translate(42, 86)">
    <text y="0">
      <tspan class="prompt">$</tspan>
      <tspan class="cmd"> python src/main.py --file data/orders_sample.csv</tspan>
    </text>

    <text y="24" class="cyan">[ROUTER] File size: 0.28 MB &lt;= 200 MB threshold (Engine: Streaming Batch Loader)</text>
    <text y="44" class="green">[INGESTION] 1,000 / 1,000 rows streamed to orders_raw in 0.12s (8,333 rows/s)</text>

    <text y="72" class="muted">=============================================================================</text>
    <text y="92" class="bold cyan">  ELT PIPELINE, QUALITY CLEANING &amp; QUARANTINE ANALYSIS</text>
    <text y="112" class="muted">=============================================================================</text>

    <text y="136">
      <tspan class="white">Run ID (Execution Key)     : </tspan>
      <tspan class="yellow">c87ce776a1f14977aaf12ab73e9d0476</tspan>
    </text>
    <text y="156">
      <tspan class="white">Raw Ingested Documents     : </tspan>
      <tspan class="white bold">1,000</tspan>
    </text>
    <text y="176">
      <tspan class="white">Validated &amp; Corrected      : </tspan>
      <tspan class="green">900 </tspan>
      <tspan class="muted">(Normalized: 200 with forensic audit trail)</tspan>
    </text>
    <text y="196">
      <tspan class="white">Quarantined Invalid Rows   : </tspan>
      <tspan class="red">100 </tspan>
      <tspan class="muted">(Non-destructive isolation)</tspan>
    </text>
    <text y="216">
      <tspan class="white">Consistency Check Equation : </tspan>
      <tspan class="green">(900 + 100) == 1000  ✔ [VERIFIED - ZERO LOSS]</tspan>
    </text>
    <text y="236">
      <tspan class="white">Idempotency &amp; Atomic Upsert: </tspan>
      <tspan class="cyan">Inserted: 0 | Updated: 0 | Unchanged: 900  ✔ [IDEMPOTENT]</tspan>
    </text>

    <text y="264" class="muted">-----------------------------------------------------------------------------</text>
    <text y="284" class="yellow bold">  DIAGNOSTIC ERROR CODES     | COUNT | QUARANTINE ROOT CAUSE</text>
    <text y="304" class="muted">-----------------------------------------------------------------------------</text>
    <text y="324">
      <tspan class="red">  MULTIPLE_CONFLICTING_ERRORS</tspan>
      <tspan class="white"> |  50   | Compound validation failure across multiple fields</tspan>
    </text>
    <text y="344">
      <tspan class="red">  CORRUPTED_ITEMS_JSON       </tspan>
      <tspan class="white"> |  25   | Malformed nested JSON syntax in order lines</tspan>
    </text>
    <text y="364">
      <tspan class="red">  EMPTY_ITEMS                </tspan>
      <tspan class="white"> |  25   | Empty order lines payload ([] array)</tspan>
    </text>
    <text y="384" class="muted">-----------------------------------------------------------------------------</text>

    <text y="410">
      <tspan class="green bold">✔ [SUCCESS]</tspan>
      <tspan class="white"> Pipeline run completed cleanly. Telemetry saved to reports/results.json</tspan>
    </text>
  </g>
</svg>
